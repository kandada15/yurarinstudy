<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('crud.static', filename='css/user_add.css') }}">
  <link rel="stylesheet" href="{{ url_for('crud.static', filename='css/header.css') }}">
  <title>ユーザ新規登録</title>
</head>
<body>
<header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  <div class="holes-container">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
  </div>

  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
  <div class="app-container">
    <div class="content-wrapper">
      <div id="inputScreen">
        <h2>新規ユーザ登録</h2>

        <div class="mode-toggle">
            <div class="toggle-switch" id="modeToggle">
                <div class="toggle-slider">受講者</div>
                <span class="toggle-text student">受講者</span>
                <span class="toggle-text admin">管理者</span>
            </div>
        </div>

        <form id="userForm" class="form">
          <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
          <h3 id="formTitle" class="section-title student">受講者登録</h3>
          
          <div>
            <div>
              <div class="input-wrap">
                <label for="user_id">ID<span style="color: red;">*</span></label>
                <input type="text" id="user_id" maxlength="10" placeholder="IDを入力...">
                <div id="user_id_error" class="error-message"></div>
              </div>
              <div class="input-wrap">
                <label for="user_name">氏名<span style="color: red;">*</span></label>
                <input type="text" id="user_name" maxlength="20" placeholder="氏名を入力...">
                <div id="user_name_error" class="error-message"></div>
              </div>
            </div>
          </div>

          <div>
            <div>
              <div class="input-wrap">
                <label>区分</label>
                <div id="user_type_label" class="classification">受講者</div>
              </div>
              <div class="input-wrap">
                <label for="user_birthday">生年月日<span style="color: red;">*</span></label>
                <input type="date" id="user_birthday">
                <div id="user_birthday_error" class="error-message"></div>
              </div>
            </div>
          </div>

          <div class="button-group">
            <button type="button" class="btn-primary" onclick="showConfirmScreen()">確認画面へ</button>
          </div>
        </form>
      </div>

      <div id="confirmScreen" class="hidden">
        <h2>登録内容の確認</h2>
        <div id="confirmContent"></div>
        <div class="button-group">
          <button type="button" class="btn-back" onclick="backToInput()">戻る</button>
          <button type="button" class="btn-primary" onclick="submitForm()">登録する</button>
        </div>
      </div>
    </div>
  </div> 

  <div id="config" data-url="{{ url_for('crud.new_user_add') }}" data-redirect="{{ url_for('dashboard.index') }}">></div>
  <script src="{{ url_for('crud.static', filename='js/user_add.js') }}"></script>
  <script src="{{ url_for('static', filename='js/header.js') }}"></script> 
</body>
</html>
