<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('task.static', filename='css/css_stu/task_inq.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <title>答案入力</title>
</head>
<body>
<header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">受講者</span>
      <!--ログアウト-->
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  {# 左側の穴 #}
  <div class="holes-container">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
  </div>

  {# 右側のタブ #}
    <div class="tabs-container">
        <a href="{{ url_for('writing.index') }}" class="tab {% if request.endpoint == 'writing.index' %}active{% endif %}" data-page="users" data-color="#e8dcc8">ライティング学習</a>
        <a href="{{ url_for('task.student_task_list') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題</a>
        <a href="{{ url_for('mypage.index') }}" class="tab" data-page="groups" data-color="#f5ead2">マイページ</a>
    </div>

<div class="app-container">
  <div class="content-wrapper">
    <div class="container">

      <form id="taskForm" method="post" action="{{ url_for('task.task_submit_post', streamed_id=task.streamed_id) }}" data-redirect="{{ url_for('task.student_task_list') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div id="inputScreen">
          <h2>{{ task.streamed_name }}</h2>
          
          <div id="formtask" class="form">
            <div class="modal-body">
              <label>問題</label>
              <div class="question-text">
                {{ task.streamed_text }}
              </div>
            </div>

            <label for="answer_text">答案<span style="color: red;">*</span></label>
            <textarea id="answer_text" name="answer_text" rows="15" cols="50" placeholder="解答を入力..."></textarea>
            <div id="answer_text_error" class="error-message"></div>

            <div class="button-group">
              <button type="button" class="btn-primary" onclick="showConfirmScreen()">確認画面へ</button>
            </div>
          </div>
        </div>
            
        <div id="confirmScreen" class="hidden">
          <h2>提出内容の確認</h2>
          <div id="confirmContent">
            <div class="confirm-section">
              <h3>入力内容</h3>
              <div class="confirm-row">
                <div class="confirm-label">問題文</div>
                <div class="confirm-value">{{ task.streamed_text }}</div>
              </div>
              <div class="confirm-row">
                <div class="confirm-label">答案</div>
                <div id="confirm-answer" class="confirm-value" style="white-space: pre-wrap;"></div>
              </div>
            </div>
          </div>
          <div class="button-group">
            <button type="button" class="btn-primary" onclick="backToInput()">戻る</button>
            <button type="button" class="btn-primary" onclick="submitForm()">提出</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="{{ url_for('task.static', filename='js/js_stu/task_inq.js') }}"></script> 
<script src="{{ url_for('static', filename='js/header.js') }}"></script>
</body>
</html>
