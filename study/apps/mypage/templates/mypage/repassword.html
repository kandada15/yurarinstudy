<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  {# Flaskのurl_forを使ってCSSを読み込み #}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <link rel="stylesheet" href="{{ url_for('mypage.static', filename='css/repassword.css') }}">
  
  <title>パスワード再設定 | 文脈工房</title>
</head>
<body>
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">受講者</span>
      {# ログアウトは直接auth.logoutアクションへ飛ばす設定にしています #}
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  {# デザイン：左側の穴 #}
  <div class="holes-container">
    {% for i in range(8) %}
      <div class="hole"></div>
    {% endfor %}
  </div>

  {# デザイン：右側のタブ #}
  <div class="tabs-container">
    <a href="{{ url_for('writing.index') }}" class="tab" data-page="users" data-color="#e8dcc8">ライティング学習</a>
    <a href="{{ url_for('task.student_task_list') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題</a>
    <a href="{{ url_for('mypage.index') }}" class="tab active" data-page="groups" data-color="#f5ead2">マイページ</a>
  </div>

  {# メインコンテンツ（原稿用紙風コンテナ） #}
  <div class="app-container">
    <div class="content-wrapper">
      <h1>パスワード再設定</h1>
      
      <form id="resetForm">
        {# CSRF対策が必要な場合のための隠しフィールド（もし設定していれば有効になります） #}
        <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

        <div>
          <label for="password">新しいパスワード <span style="color: red;">*</span></label>
          <input type="password" name="password" id="password" maxlength="12" placeholder="8～12文字で入力してください...">
          <div id="password_error" class="error-message"></div>
        </div>

        <div>
          <label for="password_confirm">確認用パスワード <span style="color: red;">*</span></label>
          <input type="password" name="password_confirm" id="password_confirm" maxlength="12" placeholder="もう一度入力してください...">
          <div id="password_confirm_error" class="error-message"></div>
        </div>

        <input type="submit" value="送信">
      </form>
    </div>
  </div>

  <div id="repassword-config" 
        data-url="{{ url_for('mypage.repassword') }}" 
        data-redirect="{{ url_for('mypage.index') }}">
  </div>

  <script src="{{ url_for('static', filename='js/header.js') }}"></script> 
  <script src="{{ url_for('mypage.static', filename='js/repassword.js') }}"></script>
</body>
</html>
