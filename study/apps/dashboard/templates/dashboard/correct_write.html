<!--添削書き込み-->
<!--ｊｓにデータをおいて動作確認できるようにしてるんだけどそこのｊｓいじってデータベースからとってくるように改良求-->
<!--一応ｊｓ統合バージョン作ってるけどよくわかんないからコメントアウトにしてるよろしくですです-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/c_write.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <title>課題添削</title>
</head>
<body>
<!--ここからbace.htmlから引っ張れる-->
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <!-- ログアウト -->
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  <!-- 左側の穴 -->
  <div class="holes-container">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- 右側のタブ -->
  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab active" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
<!--ここまで-->

  <div class="app-container">
    <div class="content-wrapper">
      <input type="hidden" name="streamed_id" value="{{ correction_student.streamed_id }}">

      <!-- streamed_id は POST 用 -->
      <input type="hidden" id="streamedId" value="{{ correction_student.streamed_id }}">

      <!-- 入力画面 -->
      <div id="inputScreen">
        <!-- ヘッダー部分 -->
        <div class="header-section">
          <div class="task-title" id="taskTitle">{{ correction_student.streamed_name }}</div>
          <div class="student-info">
            回答者名: <span class="student-name" id="studentName">{{ correction_student.student_name }}</span>
          </div>
        </div><br>

        <!-- 問題文アコーディオン -->
        <div class="question-accordion">
          <div class="question-header" onclick="toggleQuestion()">
            <span class="question-header-text">📝 問題文を表示</span>
            <span class="toggle-icon" id="toggleIcon">▼</span>
          </div>
          <div class="question-content" id="questionContent">
            <div class="question-text" id="questionText">{{ correction_student.streamed_text }}</div>
          </div>
        </div>

        <!-- ツールバー -->
        <div class="toolbar">
          <div class="color-group">
            <button class="toolbar-btn color-btn active" id="redBtn" title="赤文字">
              <span>🔴</span>
            </button>
            <button class="toolbar-btn color-btn" id="blueBtn" title="青文字">
              <span>🔵</span>
            </button>
          </div>
          <div class="toolbar-separator"></div>
          <button class="toolbar-btn" id="strikeBtn" title="取り消し線">
            <span>S̶</span> 取消線
          </button>
          <button class="toolbar-btn" id="underlineBtn" title="下線">
            <span style="text-decoration: underline;">U</span> 下線
          </button>
          <button class="toolbar-btn" id="clearBtn" title="装飾をクリア">
            <span>✕</span> クリア
          </button>
          <div class="toolbar-separator"></div>
          <button class="toolbar-btn" id="undoBtn" title="元に戻す">
            ↶ 戻す
          </button>
          <button class="toolbar-btn" id="redoBtn" title="やり直し">
            ↷ 進む
          </button>
        </div>
        <!-- 添削エリア -->
        <div class="answer-section">
          <span class="answer-label">解答（添削欄）</span>
          <div class="answer-content" contenteditable="true" id="answerContent">{{ correction_student.answer_text | safe }}</div>
          <!--</div>-->

          <div class="button-group">
            <button class="btn-back" onclick="goback('{{ correction_student.streamed_id }}')">生徒一覧に戻る</button>
            <button class="submit-btn" onclick="showConfirmation()">確認画面へ</button>
          </div>
        </div> 
      </div>

      <!-- 確認画面 -->
      <div id="confirmScreen" class="hidden">
        <h2 class="task-title">添削内容の確認</h2>
        <div id="confirmContent"></div><!--ここ消す-->
        <!--
        <div class="confirm-section">
          <div class="confirm-row">
            <div class="confirm-label">課題タイトル</div>
            <div class="confirm-value">${taskTitle?.textContent ?? ''}</div>
          </div>

          <div class="confirm-row">
            <div class="confirm-label">解答者</div>
            <div class="confirm-value">${studentName?.textContent ?? ''}</div>
          </div>

          <div class="confirm-row">
            <div class="confirm-label">添削内容</div>
            <div class="confirm-value confirm-answer">
              ${answerContent.innerHTML}
            </div>
          </div>
        </div>
        -->
        <div class="button-group">
          <button type="button" class="btn-back" onclick="backToInput()">戻る</button>
          <button type="button" class="btn-primary" onclick="submitForm()">添削完了</button>
        </div>
      </div>
       <form
         id="correctionForm"
         method="POST"
         action="{{ url_for('dashboard.submit_correction', submission_id=submission_id) }}"
         data-back-url="{{ url_for('dashboard.streamed_student_list', streamed_id=streamed_id) }}"
       >
         <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
         <input type="hidden" name="answer_text" id="answerTextInput">
          <input type="hidden" name="streamed_id" value="{{ correction_student.streamed_id }}">
       </form>
    </div>
  </div>

    function applyColor(color, onBtn, offBtn, editor) {

    function exec(command, editor, value = null) {
      editor.focus();
      document.execCommand(command, false, value);

    function toggleQuestion() {
      const content = document.getElementById('questionContent');
      const icon = document.getElementById('toggleIcon');

        icon.textContent = '▼';
      } else {
        content.classList.add('open');
        icon.textContent = '▲';
      }
    }
