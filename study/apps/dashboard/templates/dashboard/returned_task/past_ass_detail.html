<!--過去課題内容閲覧-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/past_ass_detail.css') }}">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/header.css') }}">
  <title></title>
</head>
<body>
  <!-- 共通部分 -->
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <!-- ログアウト -->
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  <!-- 左側の穴 -->
  <div class="holes-container">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- 右側のタブ -->
  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab active" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
  <!-- ここまで -->

  <div class="app-container">
    <div class="content-wrapper">
      <div class="header">
        <h1 class="title-heading">課題詳細</h1>
        <div class="respondent">解答者：<span id="respondent-name">{{ returned_task.student_name }}</span></div>
      </div>
      <div class="layout">
        <div class="left-column">
          <div class="form-group">
            <label class="form-label">タイトル</label>
            <div class="form-display" id="title">{{ returned_task.streamed_name }}</div>
          </div>
          <div class="form-group">
            <label class="form-label">問題文</label>
            <div class="form-display-area" id="question">{{ returned_task.streamed_text }}</div>
          </div>
        </div>

        <div class="right-column">
          <div class="form-group">
            <div class="side-answewr">
                <label class="form-label">解答</label>
                <button class="correction-toggle" onclick="toggleCorrection()" id="toggle-btn">添削を表示</button>
            </div>
            <!-- 表示用エリア -->
            <div class="form-display-area answer" id="answer"></div>
            
            <!-- 
              データ保持用の隠し要素 
              data属性ではなく要素の中身として保持することで、HTMLタグが混ざっていても安全に扱えます。
            -->
            <div id="data-original" style="display:none;">{{ returned_task.answer_text }}</div>
            <div id="data-corrected" style="display:none;">{{ returned_task.check_text }}</div>
          </div>
        </div>
      </div>

      <div class="button-container">
        <button class="close-button" onclick="closeWindow()">閉じる</button>
      </div>
    </div>
  </div>

<script>
let showingCorrection = false;

window.addEventListener("DOMContentLoaded", () => {
  const answer = document.getElementById("answer");
  const original = document.getElementById("data-original");
  const toggleBtn = document.getElementById("toggle-btn");

  // 初期表示は元の解答
  answer.textContent = original.textContent;
  toggleBtn.textContent = "添削を表示";
});

function toggleCorrection() {
  const answerField = document.getElementById('answer');
  const toggleBtn = document.getElementById('toggle-btn');

  const originalText = document.getElementById("data-original").textContent;
  const correctedText = document.getElementById("data-corrected").textContent;

  // // ★ innerHTML を使う
  // const originalHTML = originalDiv.innerHTML;
  // const correctedHTML = correctedDiv.innerHTML;

  if (!correctedText || correctedText.trim() === "" || correctedText === "None") {
    alert("添削内容はありません");
    return;
  }

  if (!showingCorrection) {
    answer.textContent = correctedText;
    toggleBtn.textContent = "添削を非表示";
  } else {
    answer.textContent = originalText;
    toggleBtn.textContent = "添削を表示";
  }

  showingCorrection = !showingCorrection;
}

function closeWindow() {
  window.history.back();
}
</script>

<script src="{{ url_for('dashboard.static', filename='js/header.js') }}"></script>  
</body>
</html>
