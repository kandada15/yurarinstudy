<!--過去課題閲覧トップ（グループ一覧）とメンバーリスト表示-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/past_view.css') }}">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/header.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>課題一覧</title>
</head>
<body>
<!-- 共通部分 -->
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <!-- ログアウト -->
      <button class="logout-btn" onclick="gologout()">ログアウト</button>
    </div>
  </header>

  <!-- 左側の穴 -->
  <div class="holes-container">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- 右側のタブ -->
  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab active" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
  <!--ここまで-->

  <div class="app-container">
    <div class="content-wrapper">
      <!-- 過去課題受講者一覧 -->
      <div id="correction-status-view">
        <div class="name-button-contener">
          <button class="group-back-btn" onclick="location.href='{{ url_for('dashboard.returned_group_list') }}'">
            <i class="fas fa-arrow-left"></i> 　グループ選択
          </button>
          <h1 id="correction-title">
            グループメンバー・{{ streamed_name }}
          </h1>
        </div>
        
        <div class="search-box">
          <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input
              type="text"
              name="keyword"
              class="search-input"
              placeholder="検索したいユーザーのIDまたは氏名を入力..."
            >
          </div>
          <button class="search-btn">検索</button>
        </div>
        
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>ID</th>
                <th>氏名</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="student-table">
              {% for student in student_list %}
                <tr>
                  <td><i class="fas fa-user-circle"></i></td>
                  <td>{{ student.student_id }}</td>
                  <td>{{ student.student_name }}</td>
                  <td><button class="correct-btn" onclick="goview()">過去課題閲覧　<i class="fas fa-caret-right"></i></button></td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        
      </div>

    </div>
  </div>

  <script>
  function goview() {
    window.location.href = 'list_past_ass_stu.html';

    const groupName = document
      .getElementById('correction-title')
      .textContent
      .replace('グループメンバー - ', '');

    window.location.href =
      `list_past_ass_stu.html?from=group&group=${encodeURIComponent(groupName)}`;
  }

  //     // document.getElementById('task-list-view').style.display = 'none';
  //     // メンバー一覧を表示
  //     document.getElementById('correction-status-view').style.display = 'block';
  //     // タイトル反映
  //     document.getElementById('correction-title').textContent =
  //       `グループメンバー - ${group}`;
  //   }
  // });
  </script>


  

<!--Javascriptの読み込み（必ずこの位置）-->
<script src="{{ url_for('static', filename='js/header.js') }}"></script>

<script>
  function gologout(){
    window.location.href = '/auth/logout';
  }
</script>

</body>
</html>
