<!--受講者別過去課題提出物一覧(配信済み課題一覧)-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/deli_task_list.css') }}">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/returned_task/header.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>過去課題一覧</title>
</head>
<body>
  <!-- 共通部分 -->
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <!-- ログアウト -->
      <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
    </div>
  </header>

  <!-- 左側の穴 -->
  <div class="holes-container">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- 右側のタブ -->
  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab active" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
  <!--ここまで-->

  <div class="app-container">
    <div class="content-wrapper">

      <!-- 課題一覧画面 -->
        <!--課題表示の繰り返し処理も。。。-->
        <div class="name-button-contener">
          <button class="group-back-btn" 
                  data-group-id = "{{ group_id }}"
                  data-streamed-id = "{{ streamed_id }}"
                  data-streamed-name="{{ streamed_name }}"
                  onclick="backToMemberList(this)">
            <i class="fas fa-arrow-left"></i> 　受講者選択
          </button>
          {% if tasks %}
            <h1>{{ tasks[0].student_name }}さんの過去課題一覧</h1>
          {% endif %}
        </div>
        
        <div class="task-grid">
          {% for task in tasks %}
            <div class="task-card" 
      style="cursor: pointer;" 
      onclick="location.href='{{ url_for('crud.stu_task_detail', student_id=student_id, streamed_id=task.streamed_id) }}'">
            <div class="meta-line">
              <label>配信日{{ task.sent_at.strftime('%y年%m月%d日') if task.sent_at else '―' }}</label><label>グループ：{{ task.group_name }}</label>
            </div>
            <p class="task_title">{{ task.streamed_name }}</p>
            <div class="side">
              <p class="pp">配信者:{{ task.admin_name }}</p>
              <p class="pp">提出期限:{{ task.streamed_limit.strftime('%y年%m月%d日') if task.streamed_limit else '―' }}</p>
            </div>
            </div>
          {% else %}
            <p>返却済み課題はありません。</p>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <script>

  function backToMemberList(btn) {
    const groupId = btn.dataset.groupId;
    const streamedId = btn.dataset.streamedId;
    const streamedName = btn.dataset.streamedName;

    if (!groupId || !streamedId) {
    alert("グループ情報が取得できませんでした");
    return;
  }

    window.location.href =
      `/dashboard/returned/groups/${groupId}/streamed/${streamedId}` + `?view=student&title=${encodeURIComponent(streamedName)}`;
  }
  </script>

  

<!--Javascriptの読み込み（必ずこの位置）-->
<script src="{{ url_for('static', filename='js/header.js') }}"></script>  
</body>
</html>
