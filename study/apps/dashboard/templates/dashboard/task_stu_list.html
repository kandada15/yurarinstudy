<!--task_stu_list.html-->
<!--課題別受講者一覧-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/task_stu_list.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <title>課題別受講者一覧</title>
</head>
<body>
<!--ここからbace.htmlから引っ張れる-->
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-img">文</div>
      <span class="app-name">文脈工房</span>
    </div>
    <div class="user-section">
      <span class="user-badge">管理者</span>
      <!-- ログアウト -->
      <button class="logout-btn" onclick="gologout()">ログアウト</button>
    </div>
  </header>

  <!-- 左側の穴 -->
  <div class="holes-container">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- 右側のタブ -->
  <div class="tabs-container">
    <a href="{{ url_for('crud.user_manage') }}" class="tab active" data-page="users" data-color="#e8dcc8">ユーザ管理</a>
    <a href="{{ url_for('task.task_create_form') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題配信</a>
    <a href="{{ url_for('dashboard.index') }}" class="tab" data-page="dashboard" data-color="#d4c5b0">ダッシュボード</a>
  </div>
<!--ここまで-->

  <div class="app-container">
    <div class="content-wrapper">
      <h1>{{ streamed_name }}</h1>
      <!-- 検索バーと受講者一覧のセクション -->
       <form method="get">
        <div class="search-section">
          <input type="text" name="keyword" class="search-input" placeholder="検索したいユーザの氏名を入力..." value="{{ request.args.get('keyword', '') }}">
          <button type="submit" class="search-btn">検索</button>
        </div>
       </form>
      

      <div class="table-section">
        <div class="table-header">
          <button class="return-btn"onclick="goreturn()">⇦　課題一覧へ戻る</button>
          <button class="return-btn" onclick="openReturnToList()">添削済を返却</button>
        </div>
        
        <div class="table-scroll-wrapper">
          <table class="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>氏名</th>
                <th>状況</th>
                <th>添削開始</th>
              </tr>
            </thead>
            <tbody>
              {% for sd_s in streamed_student %}
                <tr data-status="{{ sd_s.status }}">
                  <td>{{ sd_s.student_id }}</td>
                  <td>{{ sd_s.student_name }}</td>
                  <td><span class="status-badge{% if sd_s.status == '未提出' %}
                                                 status-unsubmitted
                                               {% elif sd_s.status == '未添削' %}
                                                 status-uncorrected
                                               {% elif sd_s.status == '添削済み' %}
                                                 status-completed
                                               {% endif %}
                      ">
                          {{ sd_s.status }}
                      </span>
                  </td>
                  <td>
                    {% if sd_s.submission_id %}
                      <a href="{{ url_for('dashboard.task_correction',
                        submission_id=sd_s.submission_id) }}">
                        <button type="button" class="start-btn">添削開始</button>
                      </a>
                    {% endif %}
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="returnModal" class="modal hidden">
    <div class="modal-content">
      <p>添削済みの課題を返却しますか？</p>

      <p id="returnMessage" class="modal-message hidden"></p>

      <form id="returnForm"
        data-back-url="{{ url_for('dashboard.streamed_list') }}"
        data-streamed-id="{{ streamed_id }}">

        <input type="hidden" name="streamed_id" value="{{ streamed_id }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="modal-actions">
          <button type="button" onclick="submitReturn()">返却する</button>
          <button type="button" onclick="closeReturnModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

<!-- Javascriptの読み込み（必ずこの位置） -->
  <script>
    function goreturn() {
      window.location.href = "{{ url_for('dashboard.streamed_list') }}";
    }

    function gologout(){
      window.location.href = '/auth/logout';
    }
    
    // success/errorメッセージの制御を行う
    function showModalMessage(msg, type) {
      const el = document.getElementById("returnMessage");
      el.textContent = msg;
      el.className = "modal-message " + type; // error / success
    }

    function clearModalMessage() {
      const el = document.getElementById("returnMessage");
      el.textContent = "";
      el.classList.add("hidden");
    }


    // 未添削チェック
    function openReturnToList() {
      const rows = document.querySelectorAll("tbody tr");
      const hasUnchecked = [...rows].some(
      row => row.dataset.status === "未添削"
    );

    document.getElementById("returnModal").classList.remove("hidden");

    if (hasUnchecked) {
      showToast("未添削の課題があります", "error");
      return;
    }
    clearModalMessage();
    }

    // モーダルを閉じる
    function closeReturnModal() {
      document.getElementById("returnModal").classList.add("hidden"); 
    }

    // 返却処理
    function submitReturn() {
      const form = document.getElementById("returnForm");

      const formData = new FormData(form);

      clearModalMessage();
      fetch("{{ url_for('dashboard.correction_return') }}", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success) {
          showModalMessage(data.message, "error");
          return;
        }
        showModalMessage("課題の返却が完了しました", "success");

        setTimeout(() => {
          window.location.href = form.dataset.backUrl;
        }, 2000);
      })
      .catch(() => {
        showModalMessage("返却処理に失敗しました", "error");
      });
    }
  </script>

<!-- 以下スクリプト -->
<script src="{{ url_for('static', filename='js/header.js') }}"></script> 
</body>
</html>
