<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('writing.static', filename='css/step_list.css') }}">
    <title>{{ data.name }} - 文脈工房</title>
    </head>
    <body class="fade-in">

    {# ヘッダー #}
    <header class="top-header">
        <div class="logo-section">
        <div class="logo-img">文</div>
        <span class="app-name">文脈工房</span>
        </div>
        <div class="user-section">
        <span class="user-badge">受講者</span>
        <button class="logout-btn" onclick="location.href='{{ url_for('auth.logout') }}'">ログアウト</button>
        </div>
    </header>

    {# 左側の穴 #}
    <div class="holes-container">
        {% for i in range(10) %}<div class="hole"></div>{% endfor %}
    </div>

    {# 右側のタブ #}
    <div class="tabs-container">
        <a href="{{ url_for('writing.index') }}" class="tab active" data-page="users" data-color="#e8dcc8">ライティング学習</a>
        <a href="{{ url_for('task.student_task_list') }}" class="tab" data-page="tasks" data-color="#e6d5a8">課題</a>
        <a href="{{ url_for('mypage.index') }}" class="tab" data-page="groups" data-color="#f5ead2">マイページ</a>
    </div>

    {# 原稿用紙コンテナ #}
    <div class="app-container">
        <div class="content-wrapper">
        <h1 class="title"> ＜ <span id="category-name">{{ data.name }}</span> ＞ </h1>
        
        <label class="choice-message">学習したいステージを選択しスタートボタンを押してください。</label>

        {# JSが tbody を探して中身を入れるためのテーブル構造 #}
        <table class="stageTable" id="stageTable">
            <thead>
            <tr>
                <th>ステージ</th>
                <th>フェーズ</th>
                <th>学習内容</th>
                <th></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            {# ここに JS (createStageTable) が行を流し込みます #}
            </tbody>
        </table>
        </div>  
    </div>

    {# JSが必要とするグローバル変数 #}
    <script>
        const currentCategoryId = "{{ category_id }}";
        const completedStages = {{ completed_list | tojson }};
        const learningData = {{ learning_data | tojson }};
    </script>

    {# スクリプトの読み込み #}
    <script src="{{ url_for('writing.static', filename='js/step_list.js') }}"></script> 
    <script src="{{ url_for('static', filename='js/header.js') }}"></script> 
</body>
</html>
